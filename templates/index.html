<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فحص الروابط ورموز QR الذكية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Cairo', sans-serif; }
        .security-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 30px; margin-top: 50px; }
        .header-title { color: #1e293b; font-weight: bold; }
        .badge-nca { background-color: #0f172a; color: #38bdf8; font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="security-card">
                    <div class="text-center mb-4">
                        <span class="badge badge-nca mb-2"><i class="fas fa-shield-alt me-1"></i> متوافق مع معايير الأمن السيبراني</span>
                        <h2 class="header-title">نظام كشف الروابط والتصيد (AI Phishing & Quishing Detector)</h2>
                        <p class="text-muted">أداة استباقية لتحليل وفحص الروابط ورموز الاستجابة السريعة بالذكاء الاصطناعي</p>
                    </div>

                    <div class="mb-3">
                        <label for="urlInput" class="form-label fw-bold">أدخل الرابط المراد فحصه:</label>
                        <div class="input-group">
                            <input type="text" id="urlInput" class="form-control" placeholder="https://example.com">
                            <button class="btn btn-primary" onclick="checkUrl()"><i class="fas fa-search"></i> فحص ذكي</button>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="mb-3">
                        <label for="qrFile" class="form-label fw-bold">أو رفع صورة رمز الـ QR (Quishing Detection):</label>
                        <input type="file" id="qrFile" class="form-control" accept="image/*">
                        <button class="btn btn-secondary mt-2 w-100" onclick="checkQr()"><i class="fas fa-qrcode"></i> تحليل الـ QR بالذكاء الاصطناعي</button>
                    </div>

                    <div id="resultContainer" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function checkUrl() {
            const url = document.getElementById('urlInput').value;
            if(!url) { alert('الرجاء إدخال رابط'); return; }
            
            fetch('/scan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url: url})
            })
            .then(res => res.json())
            .then(data => {
                let alertClass = data.status === 'Dangerous' ? 'alert-danger' : 'alert-success';
                document.getElementById('resultContainer').innerHTML = `
                    <div class="alert ${alertClass}">
                        <h5>${data.category}</h5>
                        <p>${data.message}</p>
                        <small class="text-muted">${data.compliance_note}</small>
                    </div>
                `;
            });
        }

        function checkQr() {
            const fileInput = document.getElementById('qrFile').files[0];
            if(!fileInput) { alert('الرجاء اختيار صورة QR'); return; }

            let formData = new FormData();
            formData.append('file', fileInput);

            fetch('/scan-qr', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                let alertClass = data.status === 'Dangerous' ? 'alert-danger' : 'alert-success';
                document.getElementById('resultContainer').innerHTML = `
                    <div class="alert ${alertClass}">
                        <h5>${data.category}</h5>
                        <p><strong>الرابط المستخرج:</strong> ${data.extracted_url || 'غير متوفر'}</p>
                        <p>${data.message}</p>
                        <small class="text-muted">${data.compliance_note}</small>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
